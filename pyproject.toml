[project]
name = "auth-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elvin", email = "elvin@ElvinGarcia.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pyotp>=2.10.0",
    "qrcode[pil]>=8.2",
    "uvicorn[standard]>=0.54.0",
    "webauthn>=3.0.1",
]

[project.scripts]
auth-demo = "auth_demo:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
