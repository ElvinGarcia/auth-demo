<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth Demo</title>
</head>
<body>
  <h1>Auth Demo</h1>
  <p>Backend status: <span id="status">checking...</span></p>
  <script>
    fetch("/api/health")
      .then(r => r.json())
      .then(d => document.getElementById("status").textContent = d.status)
      .catch(() => document.getElementById("status").textContent = "down");
  </script>
</body>
</html>
